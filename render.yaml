# Render Blueprint — https://docs.render.com/blueprint-spec
# Apply from the Render dashboard: New → Blueprint → connect this repo.

services:
  - type: web
    name: lila-viz-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Set in the dashboard to your Parquet tree (e.g. persistent disk mount).
      - key: PLAYER_DATA_PATH
        sync: false
